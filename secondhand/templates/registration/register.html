{% extends 'base.html' %}
{% block title %}สมัครสมาชิก{% endblock %}

{% block content %}
<div class="flex min-h-[70vh] items-center justify-center px-4 py-10">
  <div class="w-full max-w-md rounded-2xl border border-stone-200 bg-white p-8 shadow-lg">
    <h1 class="font-display text-2xl">สมัครสมาชิก</h1>
    <p class="mt-1 text-sm text-stone-500">มีบัญชีอยู่แล้ว? <a href="{% url 'login' %}" class="font-medium text-moss underline underline-offset-2">เข้าสู่ระบบ</a></p>

    <form method="post" class="mt-6 space-y-5">
      {% csrf_token %}
      {% for field in form %}{% include '_field.html' with field=field show_help=True %}{% endfor %}
      <button class="w-full rounded-xl bg-moss px-5 py-3 font-medium text-white shadow-sm hover:bg-moss-dark">สมัครสมาชิก</button>
    </form>
  </div>
</div>
{% endblock %}
